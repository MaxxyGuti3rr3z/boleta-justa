name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencias del parser y la subida local
        run: python -m pip install pypdf python-multipart
      - name: Calculadora tarifaria (categorias, bloques, topes, RE, meses)
        run: python pruebas/test_tarifas.py
      - name: Verificador del Decreto 5658 (plazos 20/60, punitorios, vigencia)
        run: python pruebas/test_decreto.py
      - name: Parser de boletas con texto SINTETICO (nunca datos reales)
        run: python pruebas/test_parser.py
      - name: Auditoria contra cuadros historicos (seleccion por VAD)
        run: python pruebas/test_auditoria.py
      - name: Explicacion en lenguaje llano (sin datos personales)
        run: python pruebas/test_explicar.py
