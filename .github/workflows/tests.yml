name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencias del parser y la subida local
        run: python -m pip install pypdf python-multipart
      - name: Calculadora tarifaria (categorias, bloques, topes, RE, meses)
        run: python pruebas/test_tarifas.py
      - name: Verificador del Decreto 5658 (plazos 20/60, punitorios, vigencia)
        run: python pruebas/test_decreto.py
      - name: Parser de boletas con texto SINTETICO (nunca datos reales)
        run: python pruebas/test_parser.py
      - name: Auditoria contra cuadros historicos (seleccion por VAD)
        run: python pruebas/test_auditoria.py
      - name: Explicacion en lenguaje llano (sin datos personales)
        run: python pruebas/test_explicar.py
      - name: Modo deploy publico (consentimiento y rate limit)
        run: python pruebas/test_deploy.py
      - name: Limpieza de datos sensibles (dry-run / apply / total)
        run: python pruebas/test_limpieza.py
      - name: Payload mínimo para IA y preguntas locales (sin datos personales)
        run: python pruebas/test_preguntas.py
      - name: Auth opcional (scrypt, sin datos en claro, sesiones)
        run: python pruebas/test_auth.py
      - name: Historial por usuario (solo payload validado, aislado)
        run: python pruebas/test_historial.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cliente sin servidor (parser/auditoría/explicación en navegador)
        run: node --test pruebas-js/*.test.mjs
